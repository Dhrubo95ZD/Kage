name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify gameplay and build web game
        run: npm test && npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable test APK
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify bundled offline gameplay on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p android --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: android/app/build/reports/
      - name: Package APK and checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Kage-Shadowfall-device.apk
          sha256sum apk/Kage-Shadowfall-device.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kage-Android-APK
          path: apk/*
          retention-days: 30
      - name: Publish downloadable test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-device-${GITHUB_RUN_NUMBER}" apk/* --title "Kage on-device build ${GITHUB_RUN_NUMBER}" --prerelease --notes "Bundled offline Android game. Plays inside the app with no browser launch, sign-in or internet requirement. Uses Android WebView for the existing renderer, not a native-engine port. Device saves stay separate from cloud saves; export your cloud character and import it in the app. Android 8+ with current Android System WebView required. Debug-signed test build. Source commit: ${GITHUB_SHA}. Android emulator smoke test passed; physical-device performance still needs testing."
